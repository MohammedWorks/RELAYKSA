name = "relayksa"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

# Waitlist + business leads. database_id is filled in when the
# remote database is created (`npm run db:create`); local dev ignores it.
[[d1_databases]]
binding = "DB"
database_name = "relayksa-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
